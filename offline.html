<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0e">
  <title>Offline · YJ Studios</title>
  <style>
    :root{color-scheme:dark;--ink:#090b0e;--panel:#10181e;--line:rgba(232,242,248,.12);--muted:#9ba5ad;--white:#f3f6f7;--cyan:#61e6f6}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 22%,#13252b,var(--ink) 63%);color:var(--white);font:15px/1.7 system-ui,sans-serif}
    main{width:min(520px,100%);padding:clamp(24px,7vw,42px);border:1px solid var(--line);background:rgba(16,24,30,.94)}
    img{width:54px;height:54px;border-radius:50%;border:1px solid rgba(97,230,246,.65)}.eyebrow{margin:22px 0 8px;color:var(--cyan);font-size:11px;letter-spacing:.18em;text-transform:uppercase}h1{margin:0;font-size:clamp(29px,8vw,40px);line-height:1.15}p{color:var(--muted);font-size:14px}a{display:inline-flex;min-height:44px;align-items:center;margin-top:12px;padding:0 15px;border:1px solid rgba(97,230,246,.45);color:var(--cyan);text-decoration:none}a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/yj-studios-logo.jpg" alt="YJ Studios">
    <p class="eyebrow">YJ Studios · Offline</p>
    <h1>You’re currently offline.</h1>
    <p>This page was not saved on this device. Return to the main site to use its cached interface. Previously synchronized Firestore data is available only if persistent offline storage was enabled on this trusted device.</p>
    <a href="/index.html#home">Open the saved YJ Studios site</a>
  </main>
</body>
</html>
